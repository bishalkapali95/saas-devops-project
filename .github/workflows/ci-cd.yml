name: SaaS Password-Reset CI/CD Pipeline

# ==============================================================================
# GitHub Actions CI/CD Workflow
# ==============================================================================
# DevOps Concept - Continuous Integration & Continuous Deployment:
# This workflow automates code verification, quality scanning, testing, and
# release orchestration every time code is pushed or a Pull Request is opened.
#
# Pipeline Flow:
#   [Source] ➔ [Build] ➔ [Test] ➔ [Quality/Security] ➔ [Deploy (Blue-Green)] ➔ [Monitor]
# ==============================================================================

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # ============================================================================
  # Stage 1 & 2: SOURCE & BUILD
  # ============================================================================
  build:
    name: 1. Source & Build
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 Checkout Source Code
        uses: actions/checkout@v4

      - name: 1.2 Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 1.3 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1.4 Byte-Compile Python Files (Build Validation)
        run: |
          python -m compileall app/ tests/

  # ============================================================================
  # Stage 3: TEST (Automated Testing)
  # ============================================================================
  test:
    name: 2. Automated Testing
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit and Integration Tests via Pytest
        run: |
          # Fails automatically if any unit or integration test asserts False
          python -m pytest -v --maxfail=1

  # ============================================================================
  # Stage 4: QUALITY & SECURITY GATES
  # ============================================================================
  quality_security:
    name: 3. Quality & Security Checks
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Static Code Analysis & Syntax Gate (flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity and style (treat 127 char limit)
          flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Secret Scan Verification
        run: |
          # Verify that sensitive files or raw credentials are not checked into Git
          echo "Scanning repository for forbidden secret patterns..."
          if grep -rn "BEGIN PRIVATE KEY" app/ terraform/ 2>/dev/null; then
            echo "ERROR: Private key detected in repository!"
            exit 1
          fi
          echo "Secret check passed: No hardcoded credentials detected."

  # ============================================================================
  # Stage 5: DEPLOY (Blue-Green Deployment Simulation)
  # ============================================================================
  deploy:
    name: 4. Blue-Green Release Orchestration
    needs: quality_security
    # Only deploy on main branch commits (never on unmerged feature branches or PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: saas-password-reset:${{ github.sha }}

      - name: Execute Blue-Green Release Strategy Simulation
        run: |
          echo "======================================================================"
          echo "Blue-Green Deployment Strategy Execution"
          echo "======================================================================"
          echo "Architecture Decision: Blue-Green deployment is chosen over in-place rolling"
          echo "updates to enable instantaneous zero-downtime cutover and immediate 1-click rollback."
          echo ""
          echo "1. Active Production Environment: [BLUE] (running previous release)"
          echo "2. Idle Staging Environment:       [GREEN] (deploying git commit ${{ github.sha }})"
          echo "3. Starting Green container instance on internal network..."
          echo "4. Running warm-up checks on Green environment..."
          echo "5. Switching router / load balancer traffic from BLUE -> GREEN."
          echo "6. Release completed successfully! GREEN is now ACTIVE; BLUE remains idle as instant fallback."
          echo "======================================================================"

  # ============================================================================
  # Stage 6: MONITOR (Post-Deployment Verification)
  # ============================================================================
  monitor:
    name: 5. Post-Deploy Health Monitoring
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Post-Deployment Synthetic Health Check Simulation
        run: |
          echo "======================================================================"
          echo "Post-Deployment Monitoring & Observability Check"
          echo "======================================================================"
          echo "Simulating synthetic HTTP GET /health check against live router target..."
          echo "Response: HTTP 200 OK - {\"status\": \"healthy\"}"
          echo ""
          echo "Monitoring Focus for Password-Reset SaaS:"
          echo " - Service Availability: HTTP 200 uptime percentage on /health"
          echo " - Error Budgets: Rate of HTTP 5xx vs 4xx responses"
          echo " - Domain Metrics: Number of reset tokens generated vs validated"
          echo " - Security Alerts: Spikes in invalid token attempts or brute-force requests"
          echo "======================================================================"
